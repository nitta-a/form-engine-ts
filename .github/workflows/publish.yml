name: Publish

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks and build
        run: |
          pnpm lint
          pnpm typecheck
          pnpm build
          pnpm test

      - name: Verify public API reports
        run: node scripts/check-public-api.mjs check

      - name: Check package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-packages.mjs validate

      - name: Test release tooling
        run: pnpm test:release

  npm:
    name: Publish packages to npm
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.publish.outputs.version }}
      published_json: ${{ steps.publish.outputs.published_json }}
      skipped_json: ${{ steps.publish.outputs.skipped_json }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Publish packages and poll npm availability
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-packages.mjs publish

  github:
    name: Create GitHub release
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create release from tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.npm.outputs.version }}
          PUBLISHED_JSON: ${{ needs.npm.outputs.published_json }}
          SKIPPED_JSON: ${{ needs.npm.outputs.skipped_json }}
        run: |
          node scripts/release-packages.mjs migration-notes > migration-notes.md
          {
            echo "## Package publication (${RELEASE_VERSION})"
            echo
            echo "### Published"
            echo "${PUBLISHED_JSON}" | jq -r 'if length == 0 then "- None" else .[] | "- `\(.)`" end'
            echo
            echo "### Already available"
            echo "${SKIPPED_JSON}" | jq -r 'if length == 0 then "- None" else .[] | "- `\(.)`" end'
            echo
            cat migration-notes.md
          } > release-notes.md
          gh release create "${{ github.ref_name }}" --verify-tag --generate-notes --notes-file release-notes.md --title "${{ github.ref_name }}"
