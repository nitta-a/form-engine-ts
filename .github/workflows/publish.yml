name: Publish

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks and build
        run: |
          pnpm lint
          pnpm typecheck
          pnpm build
          pnpm test

      - name: Check package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";

          const expectedVersion = process.env.RELEASE_TAG.replace(/^v/, "");
          const packages = [
            "packages/core/package.json",
            "packages/react/package.json",
            "packages/storage-memory/package.json",
            "packages/translator-mock/package.json"
          ];

          for (const path of packages) {
            const packageJson = JSON.parse(await readFile(path, "utf8"));
            if (packageJson.version !== expectedVersion) {
              throw new Error(`${path} is ${packageJson.version}; expected ${expectedVersion}`);
            }
            if (packageJson.private === true) {
              throw new Error(`${path} is still marked private`);
            }
          }
          NODE

  npm:
    name: Publish packages to npm
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: pnpm --filter "./packages/*" publish --access public --no-git-checks

  github:
    name: Create GitHub release
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create release from tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --verify-tag --generate-notes --title "${{ github.ref_name }}"
